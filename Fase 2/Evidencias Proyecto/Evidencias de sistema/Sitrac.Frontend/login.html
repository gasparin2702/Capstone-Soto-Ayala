<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SITRAC · Iniciar Sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #0f1b2a; /* Color de navegación corporativo */
        margin: 0;
    }
    .login-card {
        background: #fff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        width: 100%;
        max-width: 400px;
    }
    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }
    .login-header .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 50px;
        height: 50px;
        border-radius: 12px;
        background: linear-gradient(135deg, #5862AA 0%, #008890 100%);
        color: #fff;
        margin-bottom: 15px;
    }
    .login-header h1 {
        margin: 0;
        font-size: 24px;
        color: #0f141a;
    }
    .login-header p {
        margin: 5px 0 0;
        color: #6b7785;
        font-size: 13px;
    }
    .login-form .fld {
        margin-bottom: 20px;
    }
    .login-form label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 6px;
        color: #414d5c;
    }
    .login-form input {
        width: 100%;
        padding: 12px;
        border: 1px solid #d5dbdb;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
    }
    .login-form input:focus {
        outline: none;
        border-color: #5862AA;
        box-shadow: 0 0 0 3px rgba(88, 98, 170, 0.1);
    }
    .login-btn {
        width: 100%;
        padding: 12px;
        background: #5862AA;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
    }
    .login-btn:hover {
        background: #3F4885;
    }
    .login-btn:disabled {
        background: #a0a5cc;
        cursor: not-allowed;
    }
    .login-error {
        color: #B30023;
        font-size: 13px;
        text-align: center;
        margin-top: 15px;
        min-height: 20px;
    }
</style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <span class="mark">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
        </span>
        <h1>SITRAC · ANCI</h1>
        <p>Ley N° 21.663 · Marco de Ciberseguridad</p>
    </div>

    <form class="login-form" id="loginForm">
        <div class="fld">
            <label for="username">Usuario</label>
            <input type="text" id="username" placeholder="Ingrese su usuario" required autocomplete="username">
        </div>
        <div class="fld">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-btn" id="btnLogin">Iniciar Sesión</button>
        <div class="login-error" id="loginError"></div>
    </form>
</div>

<script type="module" src="js/login.js"></script>

</body>
</html>
