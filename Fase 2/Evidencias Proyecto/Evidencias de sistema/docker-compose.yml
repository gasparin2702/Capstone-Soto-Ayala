services:
  # Base de datos SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sitrac_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-}
      - MSSQL_PID=${MSSQL_PID:-Developer}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # API SITRAC
  sitrac-api:
    build:
      context: .
      dockerfile: Sitrac.dockerfile
    container_name: sitrac_api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080

      - ConnectionStrings__SitracConnection=Server=sqlserver;Database=DbSitrac;User Id=sa;Password=${SITRAC_DB_PASSWORD:-};TrustServerCertificate=True;

      - JwtSettings__SecretKey=${JwtSettings__SecretKey:-}
      - JwtSettings__Issuer=${JwtSettings__Issuer:-Sitrac.Server}
      - JwtSettings__Audience=${JwtSettings__Audience:-Sitrac.Frontend}
      - JwtSettings__ExpirationHours=${JwtSettings__ExpirationHours:-8}

      - WebhookApiKey=${WebhookApiKey:-}

      - GraphConfig__TenantId=${GraphConfig__TenantId:-}
      - GraphConfig__ClientId=${GraphConfig__ClientId:-}
      - GraphConfig__ClientSecret=${GraphConfig__ClientSecret:-}
      - GraphConfig__RemitenteUpn=${GraphConfig__RemitenteUpn:-}
      - GraphConfig__DestinatarioCorreo=${GraphConfig__DestinatarioCorreo:-}
      - GraphConfig__GuardarEnEnviados=${GraphConfig__GuardarEnEnviados:-true}
      - GraphConfig__TimeoutMs=${GraphConfig__TimeoutMs:-15000}
      - GraphConfig__MaxReintentos=${GraphConfig__MaxReintentos:-2}
      - GraphConfig__IntervaloEntreEnviosMs=${GraphConfig__IntervaloEntreEnviosMs:-1200}

      - TeamsConfig__Habilitado=${TeamsConfig__Habilitado:-false}
      - TeamsConfig__WebhookUrl=${TeamsConfig__WebhookUrl:-}
      - TeamsConfig__UmbralPrioridadMinima=${TeamsConfig__UmbralPrioridadMinima:-22}
      - TeamsConfig__TimeoutMs=${TeamsConfig__TimeoutMs:-10000}

      - FrontendSettings__BaseUrl=${FrontendSettings__BaseUrl:-http://127.0.0.1:5500}
      - FrontendSettings__AllowedOrigins__0=${FrontendSettings__AllowedOrigins__0:-http://localhost:5500}
      - FrontendSettings__AllowedOrigins__1=${FrontendSettings__AllowedOrigins__1:-http://127.0.0.1:5500}

      - Seguridad__HabilitarBootstrap=${Seguridad__HabilitarBootstrap:-true}

    ports:
      - "5117:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver_data:
