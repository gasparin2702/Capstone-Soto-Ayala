version: '3.8'

services:
  # ----------------------------------------------------
  # 1. Base de Datos (SQL Server 2022)
  # ----------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sitrac_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - 'MSSQL_SA_PASSWORD=Sitrac2026!Strong'
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------
  # 2. smtp4dev — Servidor SMTP de captura + UI web
  #    UI:    http://localhost:5000
  #    SMTP:  smtp4dev:25   (desde otros contenedores)
  #           localhost:2525 (desde el host)
  # --------------------------------------------------------
  smtp4dev:
    image: rnwood/smtp4dev:latest
    container_name: sitrac_smtp4dev
    ports:
      - "5000:80"
      - "2525:25"
    environment:
      - ASPNETCORE_URLS=http://+:80
    volumes:
      - smtp4dev_data:/smtp4dev
    restart: unless-stopped

  # --------------------------------------------------
  # 3. API SITRAC
  # --------------------------------------------------
  sitrac-api:
    build:
      context: .
      dockerfile: Sitrac.dockerfile
    container_name: sitrac_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

      # Base de datos
      - 'ConnectionStrings__SitracConnection=Server=sqlserver;Database=DbSitrac;User Id=sa;Password=Sitrac2026!Strong;TrustServerCertificate=True;'

      # JWT
      - JwtSettings__SecretKey=SITRAC_DOCKER_SECRET_KEY_2026_CHANGE_ME
      - JwtSettings__Issuer=Sitrac.Server
      - JwtSettings__Audience=Sitrac.Frontend
      - JwtSettings__ExpirationHours=8

      # API Key webhook INVGATE
      - WebhookApiKey=SITRAC_INVGATE_SECRET_2026

      # SMTP -> apunta al contenedor smtp4dev
      - SmtpConfig__Host=smtp4dev
      - SmtpConfig__Port=25
      - SmtpConfig__EnableSsl=false
      - SmtpConfig__UserName=demo@local.test
      - SmtpConfig__Password=no-reply
      - SmtpConfig__DestinatarioDemo=analista@local.test
      - SmtpConfig__NombreRemitente=SITRAC Docker
      - SmtpConfig__TimeoutMs=10000
      - SmtpConfig__MaxReintentos=1
      - SmtpConfig__IntervaloEntreEnviosMs=1200

      # Teams (deshabilitado)
      - TeamsConfig__Habilitado=false
      - TeamsConfig__WebhookUrl=
      - TeamsConfig__UmbralPrioridadMinima=22
      - TeamsConfig__TimeoutMs=10000

      # Frontend (para links en correos)
      - FrontendSettings__BaseUrl=http://127.0.0.1:5500/Sitrac.Frontend

    ports:
      - "5116:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      smtp4dev:
        condition: service_started
    restart: unless-stopped

volumes:
  sqlserver_data:
  smtp4dev_data: